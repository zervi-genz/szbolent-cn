# =============================================================
# szbolent.cn 宿主 nginx 反代 — 云主机 <DEPLOY_HOST>
#   容器一律 127.0.0.1 绑定，本文件只做反代（TLS 由外层/后续处理）
#   部署：/etc/nginx/conf.d/00-szbolent.conf，reload 生效
# =============================================================

server {
    listen 80 default_server;
    listen [::]:80;
    server_name _ szbolent.cn www.szbolent.cn szbolent.com.cn www.szbolent.com.cn bolent.cn www.bolent.cn;

    client_max_body_size 64m;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # 门户/博客 → WordPress 容器
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ⚠️ 已知跨机依赖（待解耦）：/v1/ → api.genz.ltd（上游 API）
    #    保留以匹配现状；解耦后删除本段（见 CATALOG.md §三）。
    location /v1/ {
        proxy_pass http://api.genz.ltd/v1/;
        proxy_set_header Host api.genz.ltd;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 10s;
    }
}
